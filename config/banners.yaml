# EatAll 诱导层配置（banner 伪装 + 伪漏洞路径 + 网站漏扫诱饵）
# 设计原则：banner 与响应版本自洽，避免一眼蜜罐
#   named: 可复用的命名配置段；ports: 端口表，use 引用 named 并叠加覆盖
#   $rand16 占位符由代理侧展开为 16 位随机 hex
#   link_pool: 链接图谱伪路径池——首页/伪路径响应自动嵌入这些链接，诱爬虫跟随
#   form: true 的响应自动追加登录表单（捕获 POST 参数组合）
link_pool:
  - "/admin/"
  - "/admin/login.php"
  - "/login.php"
  - "/index.php"
  - "/api/v1/users"
  - "/api/v1/config"
  - "/config.php"
  - "/phpinfo.php"
  - "/upload/"
  - "/download.php"
  - "/search.php"
  - "/about.php"
  - "/contact.php"
  - "/register.php"
  - "/profile.php"
  - "/settings.php"
  - "/admin/config.php"
  - "/admin/users.php"
  - "/backup/"
  - "/db/"
  - "/logs/"
  - "/tmp/"
  - "/include/"
  - "/js/app.js"
  - "/css/style.css"
  - "/robots.txt"
  - "/wp-login.php"
  - "/phpMyAdmin/"
  - "/actuator/env"
  - "/.git/config"
named:
  http_main:
    proto: http
    server_header: "nginx/1.18.0"
    responses:
      "/":
        status: 200
        headers:
          Content-Type: "text/html; charset=utf-8"
          Set-Cookie: "PHPSESSID=$rand16"
        body: |
          <html><head><title>Welcome</title></head><body>It works!</body></html>
      # —— 伪漏洞路径：让扫描器认为存在脆弱组件，诱使其打全 POC ——
      "/struts2-showcase/":
        status: 200
        body: |
          <html><head><title>Struts Showcase</title></head><body><h2>Welcome to Struts Showcase</h2></body></html>
      "/struts2-showcase/index.action":
        status: 200
        body: |
          <html><head><title>Struts Showcase</title></head><body><h2>Welcome to Struts Showcase</h2></body></html>
      "/index.action":
        status: 200
        body: |
          <html><head><title>Struts Showcase</title></head><body><h2>Welcome to Struts Showcase</h2></body></html>
      "/index.php":
        status: 200
        headers:
          Content-Type: "text/html; charset=utf-8"
          X-Powered-By: "PHP/7.4.33"
        body: |
          <?php /* ThinkPHP application */ ?>
          <html><head><title>ThinkPHP</title></head><body>Hello World</body></html>
      "/thinkphp/index.php":
        status: 200
        body: "ThinkPHP"
      "/weblogic/console/":
        status: 200
        body: |
          <html><head><title>WebLogic Server Console</title></head><body><h2>WebLogic Server Console</h2><p>Login Required</p></body></html>
      "/wls-wsat/CoordinatorPortType":
        status: 200
        body: |
          <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>
      "/actuator/env":
        status: 200
        headers:
          Content-Type: "application/json;charset=UTF-8"
        body: '{"paths":{"/":{"activeProfiles":[]}}}'
      "/actuator/health":
        status: 200
        headers:
          Content-Type: "application/json;charset=UTF-8"
        body: '{"status":"UP"}'
      "/solr/admin/":
        status: 200
        body: |
          <html><head><title>Solr Admin</title></head><body><h2>Solr Admin</h2></body></html>
      "/druid/index.html":
        status: 200
        body: |
          <html><head><title>Druid Stat</title></head><body><h2>Druid StatIndex</h2></body></html>
      "/admin/":
        status: 200
        form: true
        body: |
          <html><head><title>Admin Login</title></head><body><h2>Admin Login</h2></body></html>
      "/login.php":
        status: 200
        form: true
        body: |
          <html><head><title>Login</title></head><body><h2>Login</h2></body></html>
      "/admin/login.php":
        status: 200
        form: true
        body: |
          <html><head><title>Admin Login</title></head><body><h2>Admin Login</h2></body></html>
      "/wp-login.php":
        status: 200
        body: |
          <html><head><title>Log In</title></head><body><form method="post"><input type="text" name="log"><input type="password" name="pwd"></form></body></html>
      "/.git/config":
        status: 200
        headers:
          Content-Type: "text/plain; charset=utf-8"
        body: |
          [core]
          	repositoryformatversion = 0
          	filemode = true
          	bare = false
          [remote "origin"]
          	url = https://github.com/example/example.git
      "/phpinfo.php":
        status: 200
        body: |
          <html><head><title>phpinfo()</title></head><body><h1>PHP Version 7.4.33</h1><table><tr><td>PHP Version</td><td>7.4.33</td></tr></table></body></html>
      "/phpMyAdmin/":
        status: 200
        body: |
          <html><head><title>phpMyAdmin</title></head><body><h2>phpMyAdmin</h2><form><input type="text" name="pma_username"><input type="password" name="pma_password"></form></body></html>
    fallback:
      status: 404
      body: |
        <html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>nginx/1.18.0</center></body></html>

  redis_5:
    proto: redis
    reply_mode: "info"
    info_reply: |
      # Server
      redis_version:5.0.14
      redis_git_sha1:00000000
      redis_git_dirty:0
      redis_build_id:1234567890abcdef
      redis_mode:standalone
      os:Linux 4.15.0-72-generic x86_64
      arch_bits:64
      process_id:1234
      run_id:0123456789abcdef0123456789abcdef01234567
      tcp_port:6379
      uptime_in_seconds:86400
      uptime_in_days:1
      # Clients
      connected_clients:1
      # Memory
      used_memory:1048576
      used_memory_human:1.00M
      # Persistence
      loading:0
      # Stats
      total_connections_received:1024
      total_commands_processed:4096
      # Replication
      role:master
      connected_slaves:0

